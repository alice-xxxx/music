name: Build and release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag
        required: true
        default: nightly
        type: string
      prerelease:
        description: Prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.11.2'
  NDK_VERSION: '27.2.12479018'
  ANDROID_BUILD_TOOLS: '36.0.0'
  OPENSSL_REVISION: b71f1470962019bd89534a2919f5925f93bc5779
  SCCACHE_GHA_ENABLED: 'true'
  CMAKE_BUILD_PARALLEL_LEVEL: '4'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {name: windows-x64, runner: windows-2022, platform: windows, target: desktop, qt-arch: win64_mingw, arch: x86_64, tools: 'tools_mingw1310,qt.tools.win64_mingw1310'}
          - {name: linux-x64, runner: ubuntu-24.04, platform: linux, target: desktop, qt-arch: linux_gcc_64, arch: x86_64, tools: ''}
          - {name: macos-arm64, runner: macos-15, platform: macos, target: desktop, qt-arch: clang_64, arch: arm64, tools: ''}
          - {name: macos-x64, runner: macos-15-intel, platform: macos, target: desktop, qt-arch: clang_64, arch: x86_64, tools: ''}
          - {name: android-arm64, runner: ubuntu-24.04, platform: android, target: android, qt-arch: android_arm64_v8a, arch: arm64-v8a, tools: ''}
          - {name: ios-arm64, runner: macos-15, platform: ios, target: ios, qt-arch: ios, arch: arm64, tools: ''}
    defaults:
      run:
        shell: bash
    env:
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_NAME: ${{ matrix.name }}
      SCCACHE_GHA_VERSION: music-${{ matrix.name }}-qt6.11.2-o2-v1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - if: matrix.platform == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - if: matrix.platform == 'android'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
            /usr/local/lib/android/sdk/platforms/android-36
            /usr/local/lib/android/sdk/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
          key: android-sdk-36-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.NDK_VERSION }}

      - name: Prepare Android SDK and signing
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          sdkmanager "platforms;android-36" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$NDK_VERSION"
          signing_dir="$RUNNER_TEMP/android-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          keytool -list -keystore "$signing_dir/release.jks" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: matrix.platform == 'android'

      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: ${{ env.QT_VERSION }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.qt-arch }}
          modules: qtmultimedia qtshadertools qtimageformats qtsvg
          tools: ${{ matrix.tools }}
          cache: true
          cache-key-prefix: qt-${{ matrix.runner }}-${{ matrix.name }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install Linux deployment tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf libxcb-cursor0 libxkbcommon-x11-0 libpulse0 libegl1 libopengl0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: matrix.platform == 'android'
        id: openssl-cache
        with:
          path: .ci-deps/android_openssl
          key: android-openssl-${{ env.OPENSSL_REVISION }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: matrix.platform == 'android' && steps.openssl-cache.outputs.cache-hit != 'true'
        with:
          repository: KDAB/android_openssl
          ref: ${{ env.OPENSSL_REVISION }}
          path: .ci-deps/android_openssl
          persist-credentials: false

      - name: Configure desktop or iOS with CMake
        if: matrix.platform != 'android'
        run: |
          common=(-S . -B build -DCMAKE_BUILD_TYPE=Release -DMUSIC_APP_OPTIMIZE_RELEASE=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DMUSIC_BUILD_NAME="$BUILD_NAME")
          if [[ "$BUILD_PLATFORM" == ios ]]; then
            cmake "${common[@]}" -G Xcode -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          else
            extra=(-G Ninja -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DMUSIC_APP_DEPLOY_RUNTIME=ON)
            [[ "$BUILD_PLATFORM" == windows ]] && extra+=(-DCMAKE_CXX_COMPILER=g++)
            [[ "$BUILD_PLATFORM" == macos ]] && extra+=(-DCMAKE_OSX_ARCHITECTURES="$BUILD_ARCH" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0)
            cmake "${common[@]}" "${extra[@]}"
          fi

      - name: Configure Android with CMake
        if: matrix.platform == 'android'
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/release.jks
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMUSIC_APP_OPTIMIZE_RELEASE=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DMUSIC_BUILD_NAME="$BUILD_NAME" -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" -DANDROID_SDK_ROOT="$ANDROID_HOME" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" -DMUSIC_APP_BUILD_NUMBER="$GITHUB_RUN_NUMBER" -DMUSIC_APP_ANDROID_OPENSSL_ROOT="$GITHUB_WORKSPACE/.ci-deps/android_openssl"

      - name: Compile and package desktop or iOS
        if: matrix.platform != 'android'
        run: |
          cmake --build build --config Release --target MusicApp --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          cmake --build build --config Release --target package --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"

      - name: Compile signed Android package
        if: matrix.platform == 'android'
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/release.jks
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: cmake --build build --config Release --target apk --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"

      - name: Upload compiled package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Music-${{ matrix.name }}-${{ github.run_number }}
          path: |
            build/artifacts/*
            build/**/outputs/apk/release/*-signed.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - if: always() && matrix.platform == 'android'
        run: rm -rf "$RUNNER_TEMP/android-signing" "$GITHUB_WORKSPACE/build"

      - if: always()
        run: sccache --show-stats

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: build/release

      - uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Music ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: build/release/**/*
